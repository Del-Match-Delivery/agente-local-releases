name: Build do AgenteLocal

# Por que existe: o AgenteLocal.exe era compilado na máquina de quem publicava.
# Não havia registro de qual código virou qual binário, e a v5.76 saiu quebrada
# ("abre e fecha sozinho" em cliente real) porque o build regenerou o
# AgenteLocal.spec e perdeu a linha `runtime_tmpdir` — o próprio spec e o build.py
# carregam o aviso disso hoje.
#
# Aqui o executável nasce da tag, com o spec versionado, e o CI reprova se o
# PyInstaller não enxergar alguma das dependências.
#
# O que este workflow NÃO faz: publicar release nem mexer no version.json. A tag
# continua sendo criada por gente, e o manifesto é gerado pelo workflow da AGLR-2
# a partir da release. Aqui só se compila e se anexa o binário.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      anexar:
        description: "Anexar o .exe à release da tag atual (não para dispatch em branch)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-agente-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compilar:
    name: Compilar no Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar a partir do spec
        # `python -m PyInstaller AgenteLocal.spec` e NÃO a linha de comando com
        # flags: a CLI regenera o spec e foi assim que a v5.76 perdeu o
        # `runtime_tmpdir` e quebrou na mão do cliente.
        run: python -m PyInstaller --noconfirm --clean AgenteLocal.spec

      - name: O PyInstaller enxergou todas as dependências?
        shell: bash
        run: |
          set -euo pipefail
          aviso=$(ls build/AgenteLocal/warn-AgenteLocal.txt 2>/dev/null || true)
          if [ -z "$aviso" ]; then
            echo "::warning::arquivo de avisos do PyInstaller não encontrado — seguindo"
            exit 0
          fi
          # Só os módulos que o spec declara como hiddenimports: se um deles some,
          # o executável abre e falha na loja, não aqui.
          faltando=""
          for mod in win32api win32print serial websockets pynput usb pystray PIL; do
            if grep -qE "missing module named ${mod}\b" "$aviso"; then
              faltando="$faltando $mod"
            fi
          done
          if [ -n "$faltando" ]; then
            echo "::error::PyInstaller não encontrou:$faltando — confira o requirements.txt"
            grep -E "missing module named (win32api|win32print|serial|websockets|pynput|usb|pystray|PIL)\b" "$aviso" | head -20
            exit 1
          fi
          echo "todas as dependências declaradas no spec foram resolvidas"

      - name: O executável existe e tem tamanho de gente?
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/AgenteLocal.exe || { echo "::error::dist/AgenteLocal.exe não foi gerado"; exit 1; }
          tamanho=$(stat -c%s dist/AgenteLocal.exe)
          echo "tamanho: $((tamanho / 1024 / 1024)) MB"
          # Um onefile com tkinter, PIL e pywin32 não fica abaixo de 8 MB. Menos
          # que isso é build vazio passando por bom.
          [ "$tamanho" -gt 8000000 ] || { echo "::error::executável pequeno demais ($tamanho bytes) — build incompleto"; exit 1; }

      - name: Calcular o sha256
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/AgenteLocal.exe | awk '{print toupper($1)}' > dist/AgenteLocal.exe.sha256
          echo "sha256: $(cat dist/AgenteLocal.exe.sha256)"

      - name: Guardar o binário como artefato
        uses: actions/upload-artifact@v4
        with:
          name: AgenteLocal-${{ github.ref_name }}
          path: |
            dist/AgenteLocal.exe
            dist/AgenteLocal.exe.sha256
          retention-days: 30

      - name: Anexar à release da tag
        # NUNCA sobrescreve. O publicar_release.ps1 sobe o exe TESTADO no rascunho
        # e só então publica — e é a publicação que cria a tag e dispara este
        # workflow. Com --clobber, o binário testado (cujo hash o script já
        # conferiu) seria trocado minutos depois por um que ninguém testou, na
        # mesma URL que agentes e instalador baixam. Se a release já tem exe,
        # aqui só se compara o hash e se informa.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.anexar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "::warning::não existe release $TAG — o binário ficou como artefato do run"
            exit 0
          fi
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx 'AgenteLocal.exe'; then
            gh release download "$TAG" -p AgenteLocal.exe -O publicado.exe
            publicado=$(sha256sum publicado.exe | awk '{print toupper($1)}')
            compilado=$(cat dist/AgenteLocal.exe.sha256)
            if [ "$publicado" = "$compilado" ]; then
              echo "a release $TAG já tem este mesmo binário (sha256 $compilado)"
            else
              echo "::notice::a release $TAG já tem um AgenteLocal.exe (sha256 $publicado), diferente do compilado aqui ($compilado). O publicado NÃO foi tocado; o do CI ficou como artefato do run."
            fi
            exit 0
          fi
          gh release upload "$TAG" dist/AgenteLocal.exe dist/AgenteLocal.exe.sha256
          echo "anexado à release $TAG"
