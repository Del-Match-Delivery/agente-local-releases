# Espelho das releases do Agente Local (AGLR-5), atras do Traefik da PROJETOS.
# O TLS termina no CloudFront; aqui chega HTTP pela rede interna.

# Cache-Control por `map`: add_header dentro de location descarta os herdados.
#  - version.json: no-cache. E o gatilho de update de todas as lojas; com cache,
#    a virada (ou um rollback com allow_downgrade) chegaria atrasada.
#  - exe: 1h. O caminho tem a tag, mas um asset trocado na release reaproveita o
#    mesmo nome, entao nada de immutable.
map $uri $cache_control {
    default                       "no-cache";
    ~^/releases/.+\.exe$          "public, max-age=3600";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    autoindex off;
    charset utf-8;

    # Temporarios do espelhar.py (.baixando-*, .version-*) nunca sao servidos.
    location ~ /\. {
        deny all;
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $cache_control always;

    gzip on;
    gzip_types application/json;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /version.json {
        limit_except GET { deny all; }
        default_type application/json;
    }

    location /releases/ {
        limit_except GET { deny all; }
        types {
            application/octet-stream exe;
            text/plain sha256;
        }
    }

    location / {
        return 404;
    }
}
