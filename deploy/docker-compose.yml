# Espelho das releases do Agente Local na EC2 Delmatch_PROJETOS (AGLR-5).
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Publica em agente.delmatch.com.br: CloudFront (TLS) -> Traefik :80 -> este container.
# So serve arquivos estaticos gerados pelo deploy/publicar.sh; nada e compilado aqui.

# Nome de projeto EXPLICITO. Sem ele o Compose usa o nome da pasta, `deploy`, o mesmo
# do desafioagenda: os dois viravam um projeto so, cada deploy acusava o outro como
# orfao e um `--remove-orphans` em qualquer um derrubaria o outro.
name: agente-local-espelho

services:
  espelho:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: agente-local-espelho
    restart: unless-stopped

    # Mesmo padrao dos demais apps da instancia: so em 127.0.0.1, quem publica e o
    # Traefik. 3014 e a primeira porta livre depois da 3013 (desafioagenda).
    ports:
      - "127.0.0.1:3014:8080"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/ec2-user/agente-local-publico:/usr/share/nginx/html:ro

    networks:
      - traefik_network

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    mem_limit: 128m
    cpus: 0.5

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agentelocal.rule=Host(`agente.delmatch.com.br`)"
      - "traefik.http.routers.agentelocal.entrypoints=web"
      # O router do ComprouTai casa HostRegexp; no Traefik v2 a prioridade default
      # e o tamanho da regra, e a regra curta perderia sem isto.
      - "traefik.http.routers.agentelocal.priority=100"
      - "traefik.http.services.agentelocal.loadbalancer.server.port=8080"
      - "traefik.docker.network=chatmatch-23c58763_chatmatch-network"

networks:
  traefik_network:
    external: true
    name: chatmatch-23c58763_chatmatch-network
